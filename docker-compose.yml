services:

  db:
    image: postgres:17-alpine
    container_name: hotel_booking_db
    environment:
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password
      POSTGRES_DB: hotel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  test_db:
    image: postgres:17-alpine
    container_name: hotel_booking_db_test
    environment:
      POSTGRES_USER: hotel_user_test
      POSTGRES_PASSWORD: hotel_password_test
      POSTGRES_DB: hotel_db_test
    ports:
      - "5000:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis_broker:
    image: redis:7-alpine
    container_name: hotel_booking_redis
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_booking_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/hotel_booking/app
      - ./app/alembic.ini:/hotel_booking/alembic.ini
    depends_on:
      redis_broker:
        condition: service_started
      db:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_booking_celery
    volumes:
      - ./app:/hotel_booking/app
    env_file:
      - .env
    command: celery -A app.core.celery_config.celery_app worker --loglevel=info
    depends_on:
      redis_broker:
        condition: service_started
      db:
        condition: service_healthy 

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_booking_celery_beat
    volumes:
      - ./app:/hotel_booking/app
    env_file:
      - .env
    command: celery -A app.core.celery_config.celery_app beat --loglevel=info
    depends_on:
      redis_broker:
        condition: service_started
      db:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_test_data: