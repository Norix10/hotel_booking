services:
  db:
    image: postgres:17-alpine
    container_name: hotel_booking_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_broker:
    image: redis:7-alpine
    container_name: hotel_booking_redis
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_booking_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis_broker:
        condition: service_started
      db:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_booking_celery
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.core.celery_config.celery_app worker --loglevel=info
    depends_on:
      redis_broker:
        condition: service_started
      db:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_booking_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.core.celery_config.celery_app beat --loglevel=info
    depends_on:
      redis_broker:
        condition: service_started
      db:
        condition: service_healthy

volumes:
  postgres_data: